services:
  - type: web
    name: fastapi-gateway
    runtime: python
    healthCheckPath: /ping
    buildCommand: |
      pip install -r requirements.txt
      npm --prefix frontend/apps/tradsphere ci --include=dev
      npm --prefix frontend/apps/tradsphere run build
      rm -rf apps/tradsphere/ui_dist
      mkdir -p apps/tradsphere/ui_dist
      cp -R frontend/apps/tradsphere/dist/* apps/tradsphere/ui_dist/
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
